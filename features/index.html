                "name": "How does GAIA make Claude output trustworthy?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "GAIA encodes your coding standards as enforceable rules loaded automatically every session. Four coding principles, guardrails against technical debt patterns, scoped skills that apply project conventions at write time, test-driven development with Playwright E2E tests written before code, and the Code Audit Team, which scans every PR in Claude Code for security, performance, and architecture issues before merge."

                "@type": "Question",
                "name": "How does GAIA manage Claude's context window?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "GAIA uses three intercepts to keep Claude's working surface lean: path-scoped rules that load only when you edit matching files, LSP-backed symbol search that returns one canonical definition instead of dozens of grep matches, and /gaia-cleanse, which catches contradictions, prunes stale entries, and flags over-budget rules. Token costs stay predictable as the project grows."
                }
              },
              {
                "@type": "Question",
                "name": "How do I report a bug in GAIA?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Run /gaia-forensics. It turns any failure into a structured bug report: redacted, classified, and ready to file. User-configuration issues return the fix inline. Probable GAIA bugs file directly to GitHub with one prompt, with the same body byte-for-byte, so the maintainer can reproduce and fix them fast."
                }
              },

                "@type": "Question",
                "name": "How does GAIA keep a Claude Code project healthy over time?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Run /gaia-fitness. A fixed rule catalog lints your Claude integration, including skills, commands, agents, rules, hooks, settings, CLAUDE.md files, and the wiki, and grades each area A+ to F. It proposes fixes for your own files, applies each one only on a per-file yes, then offers to publish them as a pull request. Findings in files GAIA ships go to /update-gaia."
                }
              },

                "name": "How does GAIA diagnose slow React renders?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Run /gaia-react-perf. It drives a micro-interaction you point it at, captures real per-render attribution with a bippy harness, and reduces the raw capture to a small ranked summary so it never enters Claude's context. It flags a React.memo that re-renders anyway because a prop or context value is a new object or callback every render, plus any component whose render crosses a 16 ms frame budget. It ranks findings by how costly each wasted render is and how widely it ripples, then names the structural fix. v1 is measure-only: GAIA diagnoses, Claude applies the fix you approve."
                }
